<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>wrapper-code setup</title>
<link rel="icon" href="__FAVICON__">
<style>
  :root { color-scheme: light dark; --bg: #f6f3ff; --card: #ffffff; --fg: #1b1b3a; --muted: #6a6a8a; --line: #cfcbe6; --ink: #1b1b3a; --accent: #ff2d95; --accent-2: #12b5b9; --ok: #15803d; --err: #b91c1c; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0b0b14; --card: #15152a; --fg: #e6e8eb; --muted: #8a8aa3; --line: #2b2b4a; --ink: #1b1b3a; --accent: #ff2d95; --accent-2: #2de2e6; --ok: #4ade80; --err: #f87171; } }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.5 system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
  main { max-width: 640px; margin: 40px auto; padding: 0 16px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 0; padding: 24px; }
  h1 { font: 700 12px/1 ui-monospace, Menlo, Consolas, monospace; letter-spacing: .25em; text-transform: uppercase; color: var(--accent-2); margin: 8px 0 2px; }
  .sub { color: var(--muted); margin: 0 0 20px; font-size: 13px; }
  label { display: block; font-weight: 600; margin: 16px 0 6px; }
  .help { color: var(--muted); font-size: 13px; margin: 4px 0 0; }
  input[type=text], input[type=password], input[type=search] { width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 0; background: transparent; color: var(--fg); font-size: 15px; }
  .row { display: flex; gap: 8px; align-items: center; }
  .row input { flex: 1; }
  button { padding: 10px 16px; border-radius: 0; border: 1px solid var(--line); background: transparent; color: var(--fg); cursor: pointer; font-size: 14px; }
  button.primary { background: var(--accent); border-color: var(--ink); color: #0b0b14; font-weight: 700; box-shadow: 3px 3px 0 var(--ink); }
  button.primary:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--ink); }
  button:disabled { opacity: .6; cursor: default; }
  .profile { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border: 1px solid var(--line); border-radius: 0; margin-bottom: 8px; cursor: pointer; }
  .profile:has(input:checked) { border-color: var(--accent); box-shadow: 2px 2px 0 var(--accent); }
  .profile input { margin-top: 4px; }
  .profile code { color: var(--muted); font-size: 12px; }
  details { margin-top: 16px; }
  summary { cursor: pointer; color: var(--muted); }
  pre { background: var(--bg); border: 1px solid var(--line); border-radius: 0; padding: 12px; overflow: auto; font-size: 12px; }
  .actions { display: flex; gap: 8px; margin-top: 20px; }
  .msg { margin-top: 16px; padding: 10px 12px; border-radius: 0; display: none; }
  .msg.ok { display: block; background: color-mix(in srgb, var(--ok) 12%, transparent); color: var(--ok); }
  .msg.err { display: block; background: color-mix(in srgb, var(--err) 12%, transparent); color: var(--err); }
  a { color: var(--accent); }
  .credits { color: var(--muted); font-size: 13px; text-align: center; margin: 20px 0 0; }
  .credits a { color: inherit; }
  .profile.off { opacity: .55; cursor: not-allowed; }
  .status { color: var(--muted); font-size: 13px; }
  .status.err { color: var(--err); }
  .models { max-height: 420px; overflow: auto; }
  .models .profile[hidden] { display: none; }
  #models-filter { margin-bottom: 8px; }
  :focus-visible { outline: 2px solid var(--accent-2); outline-offset: 2px; }
  .brand { display: flex; align-items: center; gap: 16px; margin-bottom: 4px; }
  .brand-sprite svg { width: 64px; height: 64px; display: block; }
  .brand-wordmark svg { width: 200px; height: 20px; display: block; }
  .brand-wordmark svg rect { fill: var(--fg); }
  .brand-text { display: flex; flex-direction: column; }
</style>
</head>
<body>
<main>
  <div class="card">
    <header class="brand">
      <div class="brand-sprite" aria-hidden="true">__BRAND_SPRITE__</div>
      <div class="brand-text">
        <div class="brand-wordmark" role="img" aria-label="wrapper-code">__BRAND_WORDMARK__</div>
        <h1 id="title"></h1>
      </div>
    </header>
    <p class="sub"><a id="docs" target="_blank" rel="noopener">provider documentation</a></p>
    <form id="form">
      <div id="credential-block">
        <label for="credential" id="credential-label"></label>
        <div class="row">
          <input id="credential" type="password" autocomplete="off" spellcheck="false">
          <button type="button" id="toggle">Show</button>
        </div>
        <p class="help" id="credential-help"></p>
      </div>
      <div id="baseurl-block" hidden>
        <label for="baseUrl">Base URL</label>
        <input id="baseUrl" type="text" autocomplete="off" spellcheck="false">
      </div>
      <div id="profiles-block">
        <label>Model profile</label>
        <div id="profiles"></div>
      </div>
      <div id="models-block" hidden>
        <label>Model</label>
        <div class="row" style="margin-bottom:8px">
          <span class="status" id="models-status"></span>
          <button type="button" id="refresh">Refresh list</button>
        </div>
        <input id="models-filter" type="search" autocomplete="off" spellcheck="false" placeholder="Filter models, e.g. openai/ or gemma" hidden>
        <div id="models" class="models"></div>
        <label for="otherModel">Other model</label>
        <input id="otherModel" type="text" autocomplete="off" spellcheck="false" placeholder="e.g. gemma4:cloud">
        <p class="help" id="models-note"></p>
      </div>
      <details>
        <summary>Advanced: variables that will be injected</summary>
        <pre id="advanced"></pre>
      </details>
      <div class="actions">
        <button type="submit" class="primary" id="save">Test and save</button>
        <button type="button" id="cancel">Cancel</button>
      </div>
      <div class="msg" id="msg"></div>
    </form>
  </div>
  <p class="credits" id="credits"></p>
</main>
<script>
(function () {
  var setup = __SETUP_JSON__;
  var provider = setup.provider, current = setup.current, token = setup.token;
  var $ = function (id) { return document.getElementById(id); };

  $('title').textContent = provider.name + ' setup';
  $('docs').href = provider.docs;

  (function renderCredits() {
    var c = setup.credits;
    var el = $('credits');
    function link(href, text) { var a = document.createElement('a'); a.href = href; a.textContent = text; if (href.indexOf('mailto:') !== 0) { a.target = '_blank'; a.rel = 'noopener'; } return a; }
    el.appendChild(document.createTextNode('wrapper-code · ' + c.license + ' License · Created by ' + c.name + ' · '));
    el.appendChild(link('mailto:' + c.email, c.email));
    el.appendChild(document.createTextNode(' · '));
    el.appendChild(link(c.github, 'GitHub'));
    el.appendChild(document.createTextNode(' · '));
    el.appendChild(link(c.site, c.site.replace(/^https?:\/\//, '')));
  })();

  if (provider.credential) {
    $('credential-label').textContent = provider.credential.label;
    $('credential-help').textContent = provider.credential.help || '';
    if (current.hasCredential) $('credential').placeholder = 'already configured, leave blank to keep';
  } else {
    $('credential-block').hidden = true;
  }
  if (provider.editableBaseUrl) {
    $('baseurl-block').hidden = false;
    $('baseUrl').value = current.baseUrl || '';
  }

  var isModels = Boolean(provider.models);
  $('profiles-block').hidden = isModels;
  $('models-block').hidden = !isModels;

  if (!isModels) {
    var profilesEl = $('profiles');
    Object.keys(provider.profiles).forEach(function (id) {
      var p = provider.profiles[id];
      var label = document.createElement('label');
      label.className = 'profile';
      var radio = document.createElement('input');
      radio.type = 'radio'; radio.name = 'profile'; radio.value = id; radio.checked = id === current.profile;
      radio.addEventListener('change', renderAdvanced);
      var text = document.createElement('div');
      var strong = document.createElement('div'); strong.textContent = p.label;
      var code = document.createElement('code'); code.textContent = id;
      text.appendChild(strong); text.appendChild(code);
      label.appendChild(radio); label.appendChild(text);
      profilesEl.appendChild(label);
    });
  }

  function selectedProfile() {
    var el = document.querySelector('input[name=profile]:checked');
    return el ? el.value : current.profile;
  }

  var rendered = false;
  function renderModels(discovery) {
    var list = $('models');
    var status = $('models-status');
    status.className = 'status';
    if (!discovery.ok) {
      // Keep any existing list and selection; only the status line changes.
      status.className = 'status err';
      status.textContent = discovery.message;
      if (!rendered && current.model) $('otherModel').value = current.model;
      rendered = true;
      renderAdvanced();
      return;
    }
    var prev = null;
    if (rendered) {
      var was = document.querySelector('input[name=model]:checked');
      prev = was ? was.value : null;
    }
    list.textContent = '';
    var found = discovery.models.length;
    status.textContent = found ? found + ' model' + (found === 1 ? '' : 's') + ' available' : (provider.models.emptyHint || 'No models found.');
    var filter = $('models-filter');
    filter.hidden = found <= 20;
    if (filter.hidden) filter.value = '';
    discovery.models.forEach(function (m) {
      var label = document.createElement('label');
      label.className = 'profile' + (m.tools === false ? ' off' : '');
      var radio = document.createElement('input');
      radio.type = 'radio'; radio.name = 'model'; radio.value = m.name;
      radio.disabled = m.tools === false;
      if (m.contextLength) radio.setAttribute('data-context', String(m.contextLength));
      radio.checked = (rendered ? m.name === prev : m.name === current.model) && !radio.disabled;
      radio.addEventListener('change', function () { $('otherModel').value = ''; renderAdvanced(); });
      var text = document.createElement('div');
      var strong = document.createElement('div'); strong.textContent = m.name;
      label.setAttribute('data-search', (m.name + ' ' + (m.label || '')).toLowerCase());
      var meta = [];
      if (m.label && m.label !== m.name) meta.push(m.label);
      if (m.parameterSize) meta.push(m.parameterSize);
      if (m.contextLength) meta.push(Math.round(m.contextLength / 1024) + 'k context');
      if (m.priceIn !== null && m.priceIn !== undefined) {
        meta.push(m.priceIn === 0 && m.priceOut === 0 ? 'free' : '$' + m.priceIn + ' in / $' + m.priceOut + ' out per M tokens');
      }
      if (m.tools === false) meta.push('no tool support, cannot run Claude Code');
      if (m.tools === null) meta.push('tool support unknown');
      var code = document.createElement('code'); code.textContent = meta.join(' · ');
      text.appendChild(strong); text.appendChild(code);
      label.appendChild(radio); label.appendChild(text);
      list.appendChild(label);
    });
    if (!rendered && current.model && !document.querySelector('input[name=model]:checked')) $('otherModel').value = current.model;
    // A typed name that exactly matches a selectable listed model becomes that selection,
    // so its context length is sent instead of being silently dropped.
    var typedName = $('otherModel').value.trim();
    if (typedName) {
      var radios = document.querySelectorAll('input[name=model]');
      for (var i = 0; i < radios.length; i++) {
        if (radios[i].value === typedName && !radios[i].disabled) {
          radios[i].checked = true;
          $('otherModel').value = '';
          break;
        }
      }
    }
    rendered = true;
    applyFilter();
    renderAdvanced();
  }

  function applyFilter() {
    var q = $('models-filter').value.trim().toLowerCase();
    var rows = document.querySelectorAll('#models .profile');
    for (var i = 0; i < rows.length; i++) {
      rows[i].hidden = Boolean(q) && rows[i].getAttribute('data-search').indexOf(q) === -1;
    }
  }
  $('models-filter').addEventListener('input', applyFilter);

  function selectedModel() {
    var typed = $('otherModel').value.trim();
    if (typed) return { name: typed, contextLength: null };
    var el = document.querySelector('input[name=model]:checked');
    if (!el) return { name: '', contextLength: null };
    var ctx = parseInt(el.getAttribute('data-context') || '', 10);
    return { name: el.value, contextLength: isNaN(ctx) ? null : ctx };
  }

  function renderAdvanced() {
    var env;
    if (isModels) {
      var picked = selectedModel();
      var model = picked.name || '<model>';
      env = {};
      Object.keys(provider.env || {}).forEach(function (k) { env[k] = provider.env[k]; });
      var typedUrl = $('baseUrl').value.trim().replace(/\/+$/, '');
      if (typedUrl) env.ANTHROPIC_BASE_URL = typedUrl;
      provider.models.envKeys.forEach(function (k) { env[k] = model; });
      if (picked.contextLength) env.CLAUDE_CODE_AUTO_COMPACT_WINDOW = String(picked.contextLength);
    } else {
      env = provider.profiles[selectedProfile()].env;
    }
    $('advanced').textContent = Object.keys(env).map(function (k) { return k + '=' + env[k]; }).join('\n');
  }

  if (isModels) {
    $('models-note').textContent = provider.models.note || '';
    $('otherModel').addEventListener('input', function () {
      if (this.value.trim()) {
        var checked = document.querySelector('input[name=model]:checked');
        if (checked) checked.checked = false;
      }
      renderAdvanced();
    });
    $('baseUrl').addEventListener('input', renderAdvanced);
    $('refresh').addEventListener('click', function () {
      $('models-status').className = 'status';
      $('models-status').textContent = 'Refreshing…';
      var btn = $('refresh');
      btn.disabled = true;
      fetch('/models?baseUrl=' + encodeURIComponent($('baseUrl').value), { headers: { 'x-setup-token': token } })
        .then(function (res) {
          return res.text().then(function (text) {
            var body;
            try { body = JSON.parse(text); } catch (e) { body = null; }
            if (!body || typeof body !== 'object' || typeof body.ok !== 'boolean') {
              body = { ok: false, message: 'HTTP ' + res.status + (res.statusText ? ' ' + res.statusText : '') };
            }
            return body;
          });
        })
        .then(function (d) { btn.disabled = false; renderModels(d); })
        .catch(function (err) { btn.disabled = false; renderModels({ ok: false, message: err.message }); });
    });
    renderModels(setup.discovery);
  } else {
    renderAdvanced();
  }

  $('toggle').addEventListener('click', function () {
    var input = $('credential');
    input.type = input.type === 'password' ? 'text' : 'password';
    this.textContent = input.type === 'password' ? 'Show' : 'Hide';
  });

  var GONE = 'The setup server is no longer running. It may have been completed in another tab — check the terminal.';
  // Providers answer errors as {"error":{"message":...}} (Anthropic style) or {"message":...} (Alibaba style).
  function apiErrorMessage(raw) {
    var msg = String(raw || 'Request failed');
    try {
      var inner = JSON.parse(msg);
      if (inner && inner.error && typeof inner.error.message === 'string') return inner.error.message;
      if (inner && typeof inner.message === 'string') return inner.message;
    } catch (e) { /* not JSON, keep the raw message */ }
    return msg;
  }
  function show(kind, text) { var m = $('msg'); m.className = 'msg ' + kind; m.textContent = text; }
  function post(route, body) {
    return fetch(route, { method: 'POST', headers: { 'content-type': 'application/json', 'x-setup-token': token }, body: JSON.stringify(body) });
  }

  $('form').addEventListener('submit', function (ev) {
    ev.preventDefault();
    $('save').disabled = true;
    show('', '');
    var sel = isModels ? selectedModel() : null;
    post('/save', {
      credential: $('credential').value,
      profile: isModels ? undefined : selectedProfile(),
      baseUrl: $('baseUrl').value,
      model: sel ? sel.name : undefined,
      contextLength: sel ? sel.contextLength : undefined,
    })
      .then(function (res) {
        return res.text().then(function (text) {
          var body;
          try { body = JSON.parse(text); } catch (e) { body = null; }
          if (!body || typeof body !== 'object') {
            body = { ok: false, message: 'HTTP ' + res.status + (res.statusText ? ' ' + res.statusText : '') };
          }
          return { res: res, body: body };
        });
      })
      .then(function (r) {
        if (r.body.ok) {
          show('ok', 'Done. You can return to the terminal.');
          $('cancel').disabled = true;
        } else {
          show('err', (r.body.status ? 'HTTP ' + r.body.status + ': ' : '') + apiErrorMessage(r.body.message));
          $('save').disabled = false;
        }
      })
      .catch(function () { show('err', GONE); $('save').disabled = false; });
  });

  $('cancel').addEventListener('click', function () {
    post('/cancel', {}).then(function () { show('ok', 'Cancelled. Nothing was saved. You can close this tab.'); $('save').disabled = true; $('cancel').disabled = true; }, function () { show('err', GONE); });
  });
})();
</script>
</body>
</html>
